<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desain Profesional</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url(fonts/Inter-var.ttf); }
  @font-face { font-family: "Playfair"; font-weight: 400 900; src: url(fonts/PlayfairDisplay-var.ttf); }
  @font-face { font-family: "Bebas"; font-weight: 400; src: url(fonts/BebasNeue-Regular.ttf); }
  @font-face { font-family: "Pacifico"; font-weight: 400; src: url(fonts/Pacifico-Regular.ttf); }
  @font-face { font-family: "Comic"; font-weight: 700; src: url(fonts/ComicNeue-Bold.ttf); }
  html, body { margin: 0; background: #e6e4df; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: "Inter", sans-serif; color: #111827; }
  canvas { height: 86vh; aspect-ratio: 9 / 16; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .bar { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 0; background: #111827; color: #fff; cursor: pointer; }
  input[type=range] { width: 320px; }
  body.render { display: block; background: #000; }
  body.render canvas { height: auto; width: 1080px; border-radius: 0; box-shadow: none; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <input id="seek" type="range" min="0" max="40" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script src="anim.js"></script>
</body>
</html>
