<script>
(() => {
  const DURATION = 30;
  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  const set = (el, tr) => el.setAttribute('transform', tr);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const TAU = Math.PI * 2;

  // ---------- easing ----------
  const E = {
    lin: x => x,
    io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    in: x => x * x * x,
    out: x => 1 - Math.pow(1 - x, 3),
    inQ: x => x * x,
    outQ: x => 1 - (1 - x) * (1 - x),
    back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
    backS: x => { const c1 = 0.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  };
  // keyframe track: [[time, value, easeKeMenujuKeyIni], ...]
  const track = keys => {
    keys = keys.slice().sort((a, b) => a[0] - b[0]);
    return t => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        const [t1, v1, e] = keys[i];
        if (t <= t1) {
          const [t0, v0] = keys[i - 1];
          return v0 + (v1 - v0) * E[e || 'io']((t - t0) / (t1 - t0));
        }
      }
      return keys[keys.length - 1][1];
    };
  };
  // envelope 0..1 naik di [a, a+fi], turun di [b-fo, b]
  const env = (t, a, b, fi = .2, fo = .2) => E.io(clamp((t - a) / fi)) * (1 - E.io(clamp((t - (b - fo)) / fo)));
  // pegas teredam untuk goyangan daun/tangan setelah benturan
  const spring = (t, evs, freq = 2.6, decay = 4.2) => {
    let v = 0;
    for (const [ti, amp] of evs) if (t > ti) { const u = t - ti; v += amp * Math.exp(-u * decay) * Math.sin(TAU * freq * u); }
    return v;
  };
  // bobot crossfade antar-state (mulut / mata): yang lama mengecil, yang baru "pop" dengan overshoot
  const weights = (states, t, dIn = .16, dOut = .09) => {
    const w = {};
    states.forEach(([ts, name], i) => {
      const te = i + 1 < states.length ? states[i + 1][0] : 1e9;
      const a = i === 0 ? 1 : E.back(clamp((t - ts) / dIn));
      const o = 1 - E.in(clamp((t - (te - dOut)) / dOut));
      w[name] = (w[name] || 0) + (t < ts - dOut ? 0 : a * o);
    });
    return w;
  };

  // ================= TIMELINE =================
  const HOP = [[0, 620]], SY = [[0, 1.25]], TILT = [[0, 0]], SPIN = [[0, 0]];
  const landings = [];   // [waktu, amplitudo] untuk pegas daun & tangan
  const k = (arr, t, v, e) => arr.push([t, v, e]);

  // 0–3 s: muncul memantul dari bawah
  k(HOP, .62, -110, 'outQ'); k(HOP, 1.0, 0, 'inQ');
  k(HOP, 1.1, 0); k(HOP, 1.32, -42, 'outQ'); k(HOP, 1.54, 0, 'inQ');
  k(HOP, 1.6, 0); k(HOP, 1.72, -12, 'outQ'); k(HOP, 1.84, 0, 'inQ');
  k(SY, .55, 1.02, 'out'); k(SY, .95, 1.12, 'inQ'); k(SY, 1.07, .7, 'out'); k(SY, 1.18, 1.12, 'out');
  k(SY, 1.34, .98); k(SY, 1.52, 1.06); k(SY, 1.6, .84, 'out'); k(SY, 1.7, 1.05, 'out'); k(SY, 1.8, 1);
  k(SY, 1.86, .93, 'out'); k(SY, 1.96, 1.02); k(SY, 2.1, 1);
  landings.push([1.02, 22], [1.55, 14], [1.85, 7]);

  // 8–14 s: lompat senang 3x (yang ketiga lebih tinggi + berputar)
  const jump = (t0, antic, air, h) => {
    const tl = t0 + antic, tg = tl + air;
    k(SY, t0, 1); k(SY, tl, .78, 'out'); k(SY, tl + .09, 1.16, 'out'); k(SY, tl + air * .5, .98);
    k(SY, tg - .02, 1.1, 'inQ'); k(SY, tg + .08, .74, 'out'); k(SY, tg + .22, 1.07, 'out'); k(SY, tg + .36, .98); k(SY, tg + .5, 1);
    k(HOP, tl, 0); k(HOP, tl + air / 2, -h, 'outQ'); k(HOP, tg, 0, 'inQ');
    landings.push([tl, -10], [tg + .02, 20]);
    return { tl, tg };
  };
  const j1 = jump(8.0, .3, .8, 110), j2 = jump(10.0, .3, .8, 115), j3 = jump(12.0, .32, 1.0, 160);
  k(TILT, j1.tl, 0); k(TILT, j1.tl + .4, -7, 'out'); k(TILT, j1.tg + .1, 0, 'io');
  k(TILT, j2.tl, 0); k(TILT, j2.tl + .4, 7, 'out'); k(TILT, j2.tg + .1, 0, 'io');
  k(SPIN, j3.tl + .05, 0); k(SPIN, j3.tg - .05, -360, 'io');

  // 20–25 s: wow + kedip genit
  k(TILT, 22.95, 0); k(TILT, 23.25, -7, 'back'); k(TILT, 24.1, -7); k(TILT, 24.5, 0, 'io');
  landings.push([20.4, 16], [23.25, 10]);

  // 25–30 s: lompat kecil ke atas, logo muncul
  k(SY, 24.85, 1); k(SY, 25.05, .85, 'out'); k(SY, 25.15, 1.12, 'out'); k(SY, 25.55, 1);
  k(SY, 25.95, 1.08, 'inQ'); k(SY, 26.05, .84, 'out'); k(SY, 26.2, 1.05, 'out'); k(SY, 26.38, 1);
  k(HOP, 25.05, 0); k(HOP, 25.5, -70, 'outQ'); k(HOP, 26.0, 0, 'inQ');
  landings.push([25.05, -8], [26.05, 14]);

  const hopT = track(HOP), syT = track(SY), tiltT = track(TILT), spinT = track(SPIN);
  const rigFeet = track([[0, 1400], [25.1, 1400], [26.0, 1090, 'backS']]);
  const rigS = track([[0, 2.7], [25.1, 2.7], [26.0, 2.25, 'io']]);
  const shadowIn = track([[0, 0], [.4, 0], [1.0, 1, 'out']]);

  // ekspresi
  const MOUTH = [[0, 'smile'], [3.4, 'grin'], [7.4, 'smile'], [7.9, 'grin'], [13.9, 'smile'], [14.45, 'o'], [14.95, 'chew'],
    [19.35, 'grin'], [20.2, 'o'], [22.6, 'smile'], [23.2, 'smirk'], [24.3, 'smile'], [26.9, 'grin'], [29.1, 'smile']];
  const EYES = [[0, 'open'], [14.95, 'happy'], [19.35, 'open'], [23.2, 'wink'], [24.1, 'open']];
  const BLINKS = [2.5, 4.3, 6.3, 13.4, 24.9, 28.9];

  // makan
  const BITES = [15.0, 16.4, 17.8];
  const snackS = track([[0, 0], [14.35, 0], [14.75, 1, 'back'], [19.2, 1], [19.45, 0, 'in']]);
  const sliceS = track([[0, 1], [15.02, 1], [15.12, .72, 'out'], [16.42, .72], [16.52, .45, 'out'], [17.82, .45], [17.92, 0, 'out']]);
  const armRS = track([[0, 1], [14.2, 1], [14.4, 0, 'in'], [19.45, 0], [19.75, 1, 'back']]);

  // wow
  const wowW = track([[0, 0], [20.15, 0], [20.45, 1, 'back'], [22.45, 1], [22.75, 0, 'io']]);
  const grow = track([[0, 1], [20.0, 1], [20.15, .95, 'out'], [20.45, 1.08, 'back'], [22.45, 1.07], [22.8, 1, 'io']]);
  const winkW = track([[0, 0], [23.15, 0], [23.35, 1, 'back'], [24.0, 1], [24.3, 0, 'io']]);

  // teks
  const WM_START = 26.0, WM_STEP = .065;
  const byA = track([[0, 0], [26.85, 0], [27.35, 1, 'out']]);

  // lambaian tangan kanan
  const wave = (t, a, b) => {
    const e = E.back(clamp((t - a) / .35)) * (1 - E.io(clamp((t - (b - .35)) / .35)));
    return { arm: e * (-48 + 24 * Math.sin(TAU * 2.1 * (t - a))), sway: e * 2.2 * Math.sin(TAU * 1.05 * (t - a)) };
  };

  // ---------- elemen ----------
  const el = {};
  ['rig', 'shadow', 'hop', 'spin', 'tilt', 'squash', 'leg-left', 'leg-right', 'arm-left', 'arm-right', 'leaf', 'face',
    'cheek-left', 'cheek-right', 'eye-left', 'eye-right', 'arc-left', 'arc-right', 'brows', 'mouth-smile', 'mouth-grin',
    'mouth-chew', 'mouth-o', 'mouth-smirk', 'snack', 'slice', 'shock', 'stars', 'fx', 'byline', 'wm-measure', 'wm-letters'
  ].forEach(id => el[id] = $(id));

  const mk = (parent, tag, attrs) => { const n = document.createElementNS(SVGNS, tag); for (const a in attrs) n.setAttribute(a, attrs[a]); parent.appendChild(n); return n; };
  const sparkle = (parent, color) => mk(parent, 'use', { href: '#sparkle', fill: color });

  // remah mangga (deterministik)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const crumbs = [];
  BITES.forEach(bt => { for (let i = 0; i < 6; i++) crumbs.push({ t0: bt + .02, vx: -150 + rnd() * 200, vy: -170 + rnd() * 90, r: 2.5 + rnd() * 3.5,
    n: mk($('crumbs'), 'circle', { r: 1, fill: i % 2 ? '#FF9F1C' : '#FFC93C' }) }); });

  // bintang berkilau saat makan
  const STAR_POS = [[-165, -120, 20], [160, -70, 24], [-175, 40, 16], [175, 70, 18], [-115, -205, 15], [125, -195, 19], [0, -250, 14]];
  const stars = STAR_POS.map(([x, y, s], i) => ({ x, y, s, i, n: sparkle(el.stars, i % 2 ? '#FF9F1C' : '#FFC93C') }));
  // ledakan bintang saat "wow"
  const burst = Array.from({ length: 10 }, (_, i) => ({ a: (i / 10) * TAU + .2, s: i % 2 ? 13 : 19, n: sparkle(el.fx, i % 3 === 0 ? '#4CAF50' : i % 2 ? '#FF9F1C' : '#FFC93C') }));
  const winkStar = sparkle(el.fx, '#FFC93C');

  // huruf "Mangobite" satu per satu
  let letters = [];
  const layoutWordmark = () => {
    const m = el['wm-measure'], s = m.textContent;
    el['wm-letters'].textContent = '';
    letters = [...s].map((ch, i) => {
      const x0 = m.getStartPositionOfChar(i).x, w = m.getExtentOfChar(i).width;
      const n = mk(el['wm-letters'], 'text', { x: (x0 + w / 2).toFixed(1), y: 1420, 'font-size': 176 });
      n.textContent = ch;
      return { n, cx: x0 + w / 2 };
    });
    m.style.display = 'none';
  };

  // ================= RENDER (fungsi murni dari waktu) =================
  const render = t => {
    t = clamp(t, 0, DURATION);
    const hop = hopT(t);
    const lift = clamp(-hop / 110, 0, 1.3);

    // squash & stretch + napas
    const chewE = env(t, 15.0, 19.3, .15, .15), chewPh = TAU * 2.4 * (t - 15.0);
    let sy = syT(t) * (1 + .013 * Math.sin(TAU * t / 2.4)) * (1 + .025 * chewE * Math.sin(chewPh));
    const sx = 1 + (1 - sy) * .85, g = grow(t);

    const feet = rigFeet(t), S = rigS(t);
    set(el.rig, `translate(540 ${(feet - 158 * S).toFixed(2)}) scale(${S.toFixed(4)})`);
    set(el.hop, `translate(0 ${hop.toFixed(2)})`);
    set(el.spin, `rotate(${spinT(t).toFixed(2)} 0 0)`);

    const w1 = wave(t, 3.3, 7.4), w2 = wave(t, 27.0, 29.1);
    const wowE = wowW(t), wink = winkW(t);
    const tremble = 1.3 * Math.sin(TAU * 11 * t) * env(t, 20.4, 21.3, .05, .3);
    set(el.tilt, `rotate(${(tiltT(t) + w1.sway + w2.sway + tremble).toFixed(2)} 0 158)`);
    set(el.squash, `translate(0 158) scale(${(sx * g).toFixed(4)} ${(sy * g).toFixed(4)}) translate(0 -158)`);

    // bayangan
    const sh = shadowIn(t) * (1 - .55 * clamp(-hop / 160)) * (hop >= 0 ? sx * g : 1);
    set(el.shadow, `translate(-8 160) scale(${sh.toFixed(4)} ${Math.max(sh, .001).toFixed(4)}) translate(8 -160)`);
    el.shadow.setAttribute('opacity', (0.11 * (1 - .5 * clamp(-hop / 160))).toFixed(3));

    // tangan
    const flop = spring(t, landings, 2.4, 4.5);
    const squashArms = (1 - Math.min(sy, 1)) * 40;
    const armL = 58 * lift - squashArms + flop * .7 + 70 * wowE + 6 * chewE * Math.sin(chewPh * .5);
    const armR = -26 * lift + squashArms - flop * .5 - 30 * wowE - 22 * wink + w1.arm + w2.arm;
    const rs = Math.max(armRS(t), 0.0001);
    set(el['arm-left'], `rotate(${armL.toFixed(2)} -92 20)`);
    set(el['arm-right'], `translate(92 20) rotate(${armR.toFixed(2)}) scale(${rs.toFixed(4)}) translate(-92 -20)`);
    set(el['leg-left'], `rotate(${(9 * clamp(lift)).toFixed(2)} -38 100)`);
    set(el['leg-right'], `rotate(${(-9 * clamp(lift)).toFixed(2)} 22 100)`);

    // daun
    const leaf = spring(t, landings, 2.7, 3.6) * 1.1 + 3 * Math.sin(TAU * t / 2.6) + 8 * wowE * Math.sin(TAU * 4 * t) * env(t, 20.3, 21.2, .05, .4);
    set(el.leaf, `rotate(${leaf.toFixed(2)} 12 -114)`);

    // wajah
    set(el.face, `translate(0 ${(1.6 * chewE * Math.sin(chewPh)).toFixed(2)})`);
    const chewOpen = .5 - .5 * Math.cos(chewPh);
    const cheek = 1 + .24 * chewE * chewOpen + .3 * wink;
    set(el['cheek-left'], `translate(-66 12) scale(${cheek.toFixed(3)}) translate(66 -12)`);
    set(el['cheek-right'], `translate(60 12) scale(${cheek.toFixed(3)}) translate(-60 -12)`);

    let blink = 1;
    for (const b of BLINKS) { const u = (t - b) / .18; if (u > 0 && u < 1) blink = Math.min(blink, 1 - .92 * Math.pow(Math.sin(Math.PI * u), .7)); }
    const ew = weights(EYES, t);
    const es = 1 + .22 * wowE;
    const eye = (n, cx, open) => {
      const o = Math.max(open * blink, 0);
      n.style.visibility = o < .01 ? 'hidden' : 'visible';
      set(n, `translate(${cx} -15) scale(${es.toFixed(3)} ${(es * Math.max(o, .01)).toFixed(3)}) translate(${-cx} 15)`);
    };
    eye(el['eye-left'], -35, (ew.open || 0) + (ew.wink || 0));
    eye(el['eye-right'], 30, ew.open || 0);
    const arc = (n, cx, w) => { n.style.visibility = w < .01 ? 'hidden' : 'visible'; set(n, `translate(${cx} -16) scale(${Math.max(w, .01).toFixed(3)}) translate(${-cx} 16)`); };
    arc(el['arc-left'], -35, ew.happy || 0);
    arc(el['arc-right'], 30, (ew.happy || 0) + (ew.wink || 0));
    el.brows.style.visibility = wowE < .01 ? 'hidden' : 'visible';
    set(el.brows, `translate(0 ${(-12 * (1 - Math.min(wowE, 1))).toFixed(2)})`);
    el.brows.setAttribute('opacity', clamp(wowE).toFixed(3));

    const mw = weights(MOUTH, t);
    for (const name of ['smile', 'grin', 'chew', 'o', 'smirk']) {
      const n = el['mouth-' + name], w = mw[name] || 0;
      n.style.visibility = w < .01 ? 'hidden' : 'visible';
      set(n, `translate(-2.5 22) scale(${Math.max(w, .01).toFixed(3)}) translate(2.5 -22)`);
    }
    el['mouth-chew'].setAttribute('ry', (2.5 + 8 * chewOpen * chewE + 8 * (1 - chewE)).toFixed(2));

    // camilan
    const ss = snackS(t);
    el.snack.style.visibility = ss < .01 ? 'hidden' : 'visible';
    let hb = 0; for (const b of BITES) { const u = (t - (b - .25)) / .45; if (u > 0 && u < 1) hb = Math.max(hb, Math.sin(Math.PI * u)); }
    set(el.snack, `translate(${(-7 * hb).toFixed(2)} ${(-9 * hb).toFixed(2)}) translate(34 34) scale(${Math.max(ss, .01).toFixed(3)}) translate(-34 -34)`);
    const sl = sliceS(t);
    el.slice.style.visibility = sl < .01 ? 'hidden' : 'visible';
    set(el.slice, `translate(40 22) scale(${Math.max(sl, .01).toFixed(3)}) translate(-40 -22)`);
    for (const c of crumbs) {
      const u = t - c.t0;
      if (u < 0 || u > .75) { c.n.style.visibility = 'hidden'; continue; }
      c.n.style.visibility = 'visible';
      c.n.setAttribute('cx', (-4 + c.vx * u).toFixed(2));
      c.n.setAttribute('cy', (28 + c.vy * u + 380 * u * u).toFixed(2));
      c.n.setAttribute('r', (c.r * (1 - u / .75 * .6)).toFixed(2));
      c.n.setAttribute('opacity', (1 - Math.pow(u / .75, 2)).toFixed(3));
    }

    // bintang berkilau saat makan
    const starE = env(t, 15.0, 19.8, .3, .4);
    for (const s of stars) {
      const ph = (((t - 15.0 - s.i * .31) % 1.3) + 1.3) % 1.3 / 1.3;
      const sc = s.s * starE * Math.pow(Math.sin(Math.PI * ph), 1.4);
      s.n.style.visibility = sc < .2 ? 'hidden' : 'visible';
      set(s.n, `translate(${s.x} ${s.y}) rotate(${(ph * 90).toFixed(1)}) scale(${Math.max(sc, .01).toFixed(3)})`);
    }

    // kaget: garis kejut + ledakan bintang
    el.shock.style.visibility = wowE < .01 ? 'hidden' : 'visible';
    set(el.shock, `translate(108 -100) scale(${Math.max(wowE, .01).toFixed(3)}) translate(-108 100)`);
    const bu = (t - 20.3) / .95;
    for (const b of burst) {
      if (bu <= 0 || bu >= 1) { b.n.style.visibility = 'hidden'; continue; }
      b.n.style.visibility = 'visible';
      const r = 120 + 150 * E.out(bu), sc = b.s * Math.sin(Math.PI * bu);
      set(b.n, `translate(${(Math.cos(b.a) * r).toFixed(1)} ${(-10 + Math.sin(b.a) * r * 1.1).toFixed(1)}) rotate(${(bu * 120).toFixed(1)}) scale(${sc.toFixed(3)})`);
    }
    const wu = (t - 23.25) / .8;
    winkStar.style.visibility = wu > 0 && wu < 1 ? 'visible' : 'hidden';
    if (wu > 0 && wu < 1) set(winkStar, `translate(${(78 + 14 * wu).toFixed(1)} ${(-52 - 18 * wu).toFixed(1)}) rotate(${(wu * 140).toFixed(1)}) scale(${(16 * Math.sin(Math.PI * wu)).toFixed(3)})`);

    // teks
    letters.forEach((L, i) => {
      const u = clamp((t - (WM_START + i * WM_STEP)) / .5);
      L.n.style.visibility = u <= 0 ? 'hidden' : 'visible';
      const sc = Math.max(E.back(u), .01), dy = 70 * (1 - E.out(u));
      set(L.n, `translate(0 ${dy.toFixed(2)}) translate(${L.cx.toFixed(1)} 1420) scale(${sc.toFixed(3)}) translate(${(-L.cx).toFixed(1)} -1420)`);
    });
    const ba = byA(t);
    el.byline.setAttribute('opacity', ba.toFixed(3));
    set(el.byline, `translate(0 ${(30 * (1 - ba)).toFixed(2)})`);
  };

  // ================= PLAYER =================
  const params = new URLSearchParams(location.search);
  const isRender = params.has('render');
  if (isRender) document.body.classList.add('render');

  let t = 0, speed = 1, playing = false, last = 0, recording = false, recTimer = 0;
  const btnPlay = $('btn-play'), scrub = $('scrub'), timeEl = $('time'), bigplay = $('bigplay'), toast = $('toast');
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>';
  const syncUI = () => {
    btnPlay.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    scrub.value = t.toFixed(2);
    timeEl.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)}`;
  };
  let toastTimer;
  const say = msg => { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); };

  const play = () => { if (t >= DURATION) t = 0; playing = true; toast.classList.remove('show'); bigplay.style.display = 'none'; last = performance.now(); syncUI(); };
  const pause = () => { playing = false; syncUI(); };
  const replay = () => { t = 0; play(); };
  const setHidden = (h, quiet) => { document.body.classList.toggle('hidden-ui', h); if (h && !quiet) say('H / ketuk layar (saat berhenti) untuk kontrol'); };

  const loop = now => {
    if (playing) {
      t += (now - last) / 1000 * speed;
      if (t >= DURATION) { t = DURATION; playing = false; if (recording) recording = false; }
    }
    last = now;
    render(t);
    syncUI();
    requestAnimationFrame(loop);
  };

  btnPlay.onclick = () => (playing ? pause() : play());
  bigplay.onclick = replay;
  $('btn-replay').onclick = replay;
  scrub.oninput = () => { t = +scrub.value; bigplay.style.display = 'none'; };
  document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
    speed = +b.dataset.speed;
    document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('btn-hide').onclick = () => setHidden(true);
  // Mode rekam: sembunyikan kontrol, tahan 1 detik di layar kosong, lalu putar dari awal.
  $('btn-rec').onclick = () => {
    setHidden(true, true); pause(); t = 0; recording = true; bigplay.style.display = 'none';
    clearTimeout(recTimer); recTimer = setTimeout(play, 1000);
  };
  // Di HP: setelah animasi selesai, ketuk layar untuk memunculkan kontrol lagi.
  $('stage').addEventListener('click', () => {
    if (document.body.classList.contains('hidden-ui') && !recording && !playing) setHidden(false);
  });
  const fullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    const key = e.key.toLowerCase();
    if (key === ' ') { e.preventDefault(); playing ? pause() : play(); }
    else if (key === 'h') { setHidden(!document.body.classList.contains('hidden-ui')); }
    else if (key === 'r') replay();
    else if (key === 'f') fullscreen();
    else if (key === 'arrowright') t = Math.min(DURATION, t + 1);
    else if (key === 'arrowleft') t = Math.max(0, t - 1);
    else if ('1234'.includes(key) && key) document.querySelectorAll('[data-speed]')[+key].click();
  });

  const ready = document.fonts.ready.then(() => document.fonts.load('700 176px MangoRound')).then(() => { layoutWordmark(); });
  ready.then(() => {
    if (params.has('t')) { t = +params.get('t'); bigplay.style.display = 'none'; }
    else if (params.has('autoplay')) play();
    else t = DURATION;          // poster: tampilkan frame akhir sebelum diputar
    render(t);
    if (!isRender) requestAnimationFrame(loop);
  });

  window.MANGOBITE = { DURATION, render, ready };
})();
</script>
</body>
</html>
